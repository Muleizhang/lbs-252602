<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>全国文保单位 POI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div style="flex:1;position:relative;">
      <div id="map-container"></div>
      <div id="toolbar">
        <select id="sel-province"><option value="">全部省份</option></select>
        <select id="sel-category"><option value="">全部类别</option></select>
        <select id="sel-batch"><option value="">全部批次</option></select>
        <select id="sel-extended"><option value="">扩展信息不限</option><option value="1">有扩展信息(图片/官网)</option><option value="0">无扩展信息</option></select>
        <input id="txt-name" type="text" placeholder="关键词">
        <button id="btn-search">搜索</button>
        <button id="btn-rect">拉框查询</button>
        <button id="btn-radius">半径查询</button>
        <button id="btn-clear">重置</button>
        <span style="border-left: 1px solid #ccc; height: 16px; margin: 0 4px;"></span>
        <span id="user-info" style="color: #1890ff; font-weight: bold; display: none;"></span>
        <button id="btn-login-show">登录 / 注册</button>
        <button id="btn-profile" style="display:none;">🔑 API Keys</button>
        <button id="btn-logout" style="display:none;">退出</button>
        <span style="border-left: 1px solid #ccc; height: 16px; margin: 0 4px;"></span>
        <button id="btn-debug-toggle" class="active">Debug</button>
      </div>
      <div id="info-window"></div>
    </div>
    <div id="debug-panel">
      <div class="header">
        <span>API Debug</span>
        <button onclick="clearDebug()">Clear</button>
      </div>
      <div id="debug-log"></div>
    </div>
  </div>

  <!-- Modals -->
  <div id="modal-auth" class="modal">
    <div class="modal-content">
      <h3 id="auth-title" style="margin-bottom:12px;">用户登录</h3>
      <input id="auth-user" type="text" placeholder="用户名" style="width:100%; margin-bottom:8px; padding:6px;">
      <input id="auth-pass" type="password" placeholder="密码" style="width:100%; margin-bottom:8px; padding:6px;">
      <input id="auth-email" type="email" placeholder="邮箱 (仅注册需要)" style="width:100%; margin-bottom:8px; padding:6px; display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
        <a href="javascript:void(0)" id="auth-toggle" style="font-size:12px; color:#1890ff; text-decoration:none;">没有账号？去注册</a>
        <div>
          <button class="cancel" onclick="document.getElementById('modal-auth').style.display='none'">取消</button>
          <button id="btn-auth-submit">确定</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-profile" class="modal">
    <div class="modal-content" style="width:520px; max-width:90%;">
      <h3 style="margin-bottom:12px;">我的 API Keys</h3>
      <div style="background:#f5f5f5; padding:8px; margin-bottom:12px; border-radius:4px; font-size:12px;">
        当前用户：<b id="prof-user"></b> | 角色：<b id="prof-role"></b><br>
        <span style="color:#888;">必须拥有有效的 API Key 才能检索。新生成的 Key 会自动启用。</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input id="new-key-name" type="text" placeholder="Key 备注名称（可选）" style="flex:1;padding:4px;font-size:12px;">
        <button id="btn-create-key">生成新 Key</button>
      </div>
      <div id="new-key-display" style="display:none;"></div>
      <div id="key-list" style="max-height:260px; overflow-y:auto; border:1px solid #eee; padding:4px;"></div>
      <div style="text-align:right; margin-top:12px;">
        <button class="cancel" onclick="document.getElementById('modal-profile').style.display='none'">关闭</button>
      </div>
    </div>
  </div>

  <div id="modal-edit-poi" class="modal">
    <div class="modal-content" style="width:540px; max-width:92%;">
      <h3 id="edit-poi-title" style="margin-bottom:12px;">编辑 POI</h3>
      <input type="hidden" id="edit-poi-id">
      <div class="edit-grid">
        <label>名称</label><input id="edit-name" type="text">
        <label>编号</label><input id="edit-code" type="text">
        <label>类别</label><select id="edit-category">
          <option value="">请选择</option>
          <option value="古遗址">古遗址</option>
          <option value="古墓葬">古墓葬</option>
          <option value="古建筑">古建筑</option>
          <option value="石窟寺及石刻">石窟寺及石刻</option>
          <option value="近现代重要史迹及代表性建筑">近现代重要史迹及代表性建筑</option>
          <option value="其他">其他</option>
        </select>
        <label>年代</label><input id="edit-era" type="text">
        <label>批次</label><select id="edit-batch">
          <option value="">请选择</option>
          <option value="1">第1批</option><option value="2">第2批</option>
          <option value="3">第3批</option><option value="4">第4批</option>
          <option value="5">第5批</option><option value="6">第6批</option>
          <option value="7">第7批</option><option value="8">第8批</option>
        </select>
        <label>省份</label><input id="edit-province" type="text">
        <label>城市</label><input id="edit-city" type="text">
        <label>地址</label><input id="edit-address" type="text">
        <label>经度</label><input id="edit-lng" type="number" step="any">
        <label>纬度</label><input id="edit-lat" type="number" step="any">
        <label>描述</label><textarea id="edit-description" rows="3"></textarea>
        <label>官网</label><input id="edit-website" type="text">
        <label>百科链接</label><input id="edit-baike-url" type="text">
      </div>
      <div style="text-align:right; margin-top:12px;">
        <button class="cancel" onclick="document.getElementById('modal-edit-poi').style.display='none'">取消</button>
        <button id="btn-edit-save">保存</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    window._AMapSecurityConfig = { securityJsCode: window.LBS_CONFIG.AMAP_SECURITY_JS_CODE };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=108142b723aa6342db9bdf29a1e8f20d&plugin=AMap.Geolocation,AMap.MouseTool,AMap.MassMarks"></script>
  <script src="app.js"></script>
  <script>window._mapInit();</script>
</body>
</html>
