services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lbs
      POSTGRES_USER: lbs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lbs_dev_2026}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
